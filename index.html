<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Classroom Availability Tracker</title>
    <!-- Panzoom JS for interactive zooming and panning -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #0b6623; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; margin-top: 0; margin-bottom: 20px; font-weight: 500; }
        
        /* Interactive Map Viewer Styles */
        .map-card { background: #f0f7f2; border: 1px dashed #0b6623; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .map-title { font-weight: bold; color: #0b6623; margin-bottom: 8px; display: block; font-size: 1.05em; }
        
        .map-viewport { 
            width: 100%; 
            height: 320px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            background: #222; 
            overflow: hidden; 
            position: relative; 
            cursor: grab;
            margin: 10px 0;
        }
        .map-viewport:active { cursor: grabbing; }
        
        #map-image { 
            max-width: 100%; 
            height: auto; 
            display: block; 
            margin: auto; 
            transition: transform 0.1s ease;
        }

        .map-controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .map-btn { background: #0b6623; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .map-btn:hover { background: #084d1a; }
        
        /* Filter Pills for CAS Buildings */
        .filter-container { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center; }
        .filter-pill { background: #e0e0e0; color: #333; border: none; padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 0.85em; font-weight: 500; }
        .filter-pill.active { background: #0b6623; color: white; }

        .room { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; }
        .Available { color: green; font-weight: bold; }
        .Occupied { color: red; font-weight: bold; }
        .btn { background: #0b6623; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .btn-lock { background: #555; }
        .controls { margin-top: 10px; background: #eee; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ISU Classroom Availability Tracker</h1>
    <p class="sub">College of Arts and Sciences (CAS)</p>
    
    <div id="admin-bar" style="text-align: right; margin-bottom: 10px;">
        <button class="btn" onclick="login()">Admin Login</button>
    </div>

    <!-- Campus Layout Viewer Container -->
    <div class="map-card">
        <span class="map-title">Interactive Campus Layout</span>
        <p style="font-size: 0.8em; color: #555; margin: 0;">Drag to pan, scroll or use buttons to zoom and adjust view:</p>
        
        <div class="map-viewport" id="map-container">
            <img id="map-image" src="image.png" alt="Campus Building Layout">
        </div>

        <div class="map-controls">
            <button class="map-btn" onclick="zoomIn()">Zoom In</button>
            <button class="map-btn" onclick="zoomOut()">Zoom Out</button>
            <button class="map-btn" onclick="rotateMap()">Rotate 90</button>
            <button class="map-btn" onclick="resetMap()">Reset View</button>
        </div>
    </div>

    <!-- CAS Building Filter Tabs -->
    <div class="filter-container">
        <button class="filter-pill active" onclick="filterBuilding('All', this)">All Buildings</button>
        <button class="filter-pill" onclick="filterBuilding('Abaya Hall', this)">Abaya Hall</button>
        <button class="filter-pill" onclick="filterBuilding('ELS Building', this)">ELS Building</button>
        <button class="filter-pill" onclick="filterBuilding('Comm Building', this)">Comm Building</button>
        <button class="filter-pill" onclick="filterBuilding('New Science Building', this)">New Science Building</button>
        <button class="filter-pill" onclick="filterBuilding('Psychology Building', this)">Psychology Building</button>
        <button class="filter-pill" onclick="filterBuilding('Science Building', this)">Science Building</button>
    </div>

    <!-- Room List Container -->
    <div id="rooms"></div>
</div>
