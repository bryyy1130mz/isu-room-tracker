<script>
    const defaultRooms = [
        { id: 1, name: "Chem Lab 101", location: "Science Wing", status: "Available", start: "", end: "" },
        { id: 2, name: "Lecture Hall A", location: "Main Building", status: "Available", start: "", end: "" },
        { id: 3, name: "Room 203", location: "Main Building", status: "Occupied", start: "13:00", end: "14:30" }
    ];

    const ADMIN_PIN = "1234"; // Set your desired admin PIN here
    let isAdmin = false;
    let rooms = JSON.parse(localStorage.getItem('isu_rooms')) || defaultRooms;

    function renderRooms() {
        const container = document.getElementById('room-list');
        container.innerHTML = '';

        // Admin Toggle Button Header
        const adminHeader = document.createElement('div');
        adminHeader.style.cssText = 'text-align: right; margin-bottom: 15px;';
        adminHeader.innerHTML = isAdmin 
            ? `<span style="color: green; font-weight: bold; margin-right: 10px;">🔓 Faculty Mode</span><button onclick="toggleAdmin(false)" class="btn" style="background:#777;">Lock Mode</button>`
            : `<button onclick="promptAdmin()" class="btn">🔑 Admin Login</button>`;
        container.appendChild(adminHeader);

        rooms.forEach((room, index) => {
            const card = document.createElement('div');
            card.className = 'room-card';

            const badgeText = room.status === 'Occupied' && room.start && room.end 
                ? `Occupied (${formatTime(room.start)} – ${formatTime(room.end)})` 
                : room.status;

            // Only show edit controls if logged in as Admin
            const controlsHTML = isAdmin ? `
                <div class="controls">
                    <label>Status:</label>
                    <select onchange="updateStatus(${index}, this.value)">
                        <option value="Available" ${room.status === 'Available' ? 'selected' : ''}>Available</option>
                        <option value="Occupied" ${room.status === 'Occupied' ? 'selected' : ''}>Occupied</option>
                    </select>
                    <label>From:</label>
                    <input type="time" value="${room.start}" onchange="updateTime(${index}, 'start', this.value)">
                    <label>To:</label>
                    <input type="time" value="${room.end}" onchange="updateTime(${index}, 'end', this.value)">
                </div>
            ` : '';

            card.innerHTML = `
                <div class="room-header">
                    <div>
                        <div class="room-title">${room.name}</div>
                        <div class="room-location">${room.location}</div>
                    </div>
                    <span class="status-badge ${room.status.toLowerCase()}">${badgeText}</span>
                </div>
                ${controlsHTML}
            `;
            container.appendChild(card);
        });
    }

    function promptAdmin() {
        const pin = prompt("Enter Faculty/Admin PIN to unlock controls:");
        if (pin === ADMIN_PIN) {
            isAdmin = true;
            renderRooms();
        } else if (pin !== null) {
            alert("Incorrect PIN!");
        }
    }

    function toggleAdmin(status) {
        isAdmin = status;
        renderRooms();
    }

    function updateStatus(index, newStatus) {
        rooms[index].status = newStatus;
        saveAndRender();
    }

    function updateTime(index, field, value) {
        rooms[index][field] = value;
        if (value) rooms[index].status = "Occupied";
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('isu_rooms', JSON.stringify(rooms));
        renderRooms();
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        const [hours, minutes] = timeStr.split(':');
        let h = parseInt(hours, 10);
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${h}:${minutes} ${ampm}`;
    }

    renderRooms();
</script>
