<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU CAS Classroom Availability Tracker</title>
    <!-- Firebase SDKs for Real-Time Synchronization -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #072e1d; 
            background-image: radial-gradient(circle at 15% 20%, #0e4d31 0%, #072e1d 70%);
            margin: 0; 
            padding: 20px 15px; 
            color: #333; 
            min-height: 100vh;
        }

        /* Portal Top Navigation Bar */
        .portal-header {
            max-width: 720px;
            margin: 0 auto 15px auto;
            background: rgba(10, 58, 36, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .portal-logo-area { display: flex; align-items: center; gap: 10px; }
        .portal-title { font-size: 1.05em; font-weight: 700; letter-spacing: 0.5px; color: #ffc107; }
        .portal-subtitle { font-size: 0.75em; opacity: 0.85; color: #e2e8e4; }
        .admin-portal-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: background 0.2s;
        }
        .admin-portal-btn:hover { background: rgba(255,255,255,0.25); }

        /* Main Floating Container Card (Matching Portal Style) */
        .container { 
            max-width: 720px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.35); 
        }
        
        .header-title { 
            text-align: center;
            border-bottom: 2px solid #edf2ef; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        h1 { font-size: 1.5em; color: #072e1d; margin: 0; }
        p.sub { font-size: 0.9em; color: #555; margin: 4px 0 0 0; font-weight: 600; }
        
        /* Quick Search Bar */
        .search-container { margin-bottom: 18px; }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.98em;
            border: 1.5px solid #d0dcd4;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            background: #f9fbf9;
        }
        .search-input:focus { border-color: #072e1d; background: #fff; box-shadow: 0 0 0 3px rgba(7,46,29,0.1); }

        /* Live Summary Banner */
        .summary-banner {
            display: flex;
            justify-content: space-around;
            background: #f0f7f2;
            border: 1px solid #cce3d2;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.91em;
            font-weight: 700;
        }
        .summary-item.avail { color: #28a745; }
        .summary-item.occ { color: #dc3545; }

        /* Interactive Classroom Location / Image Carousel Styles */
        .map-card { background: #f4f8f5; border: 1.5px dashed #0b6623; border-radius: 12px; padding: 14px; margin-bottom: 22px; text-align: center; }
        .map-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .map-title { font-weight: bold; color: #072e1d; font-size: 0.98em; margin: 0; }
        .slide-counter { font-size: 0.78em; background: #e2e8e4; padding: 2px 9px; border-radius: 12px; font-weight: 600; color: #444; }
        
        .map-viewport { 
            width: 100%; 
            height: 290px; 
            border: 1px solid #cbd5ce; 
            border-radius: 10px; 
            background: #111; 
            overflow: hidden; 
            position: relative; 
            touch-action: pan-y;
        }
        
        #map-image { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
            transition: opacity 0.2s ease-in-out;
        }

        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); color: white; border: none;
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            font-size: 1.15em; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; z-index: 10;
        }
        .carousel-btn:hover { background: rgba(0,0,0,0.85); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .swipe-hint { font-size: 0.78em; color: #666; margin-top: 8px; font-style: italic; display: none; }
        
        /* Filter Pills for CAS Buildings (Styled like the portal pills) */
        .filter-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; justify-content: center; }
        .filter-pill { 
            background: #eef3f0; 
            color: #333; 
            border: 1px solid #d5e0d8; 
            padding: 9px 15px; 
            border-radius: 22px; 
            cursor: pointer; 
            font-size: 0.83em; 
            font-weight: 600; 
            transition: all 0.2s ease; 
        }
        .filter-pill:hover { background: #e2ebe4; }
        .filter-pill.active { background: #072e1d; color: #ffc107; border-color: #072e1d; box-shadow: 0 3px 8px rgba(7,46,29,0.3); }

        /* Two-Column Symmetric Card Layout */
        .room-card { 
            display: flex; 
            align-items: center; 
            border: 1.5px solid #e0e8e3; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            background: #fff; 
            overflow: hidden; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .room-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.06);
            border-color: #b5c9bc;
        }
        
        .room-info { 
            flex: 1; 
            padding: 14px 16px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .room-name { font-weight: 700; color: #1a2e22; font-size: 0.98em; }
        .room-loc { font-size: 0.8em; color: #666; margin-top: 3px; }
        
        /* Right-hand Action Column */
        .room-action-col {
            width: 140px;
            display: flex;
            flex-direction: column;
        }

        .room-badge { 
            width: 100%; 
            min-height: 46px;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 0.82em; 
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: white;
            text-align: center;
            padding: 4px;
        }
        .room-badge.Available { background: #28a745; }
        .room-badge.Occupied { background: #dc3545; }
        .time-badge { font-size: 0.67em; font-weight: normal; margin-top: 2px; opacity: 0.95; text-transform: none; line-height: 1.1; }

        /* Clean "View Room" Small Capsule Button */
        .view-room-btn {
            width: 100%;
            background: #e6efe8;
            color: #072e1d;
            border: none;
            border-top: 1px solid #ccdcd1;
            padding: 6px 0;
            font-size: 0.75em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        .view-room-btn:hover {
            background: #cfe0d3;
        }

        .btn { background: #072e1d; color: white; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.82em; font-weight: 600; }
        .btn-lock { background: #555; }
        .btn-edit { background: #2980b9; margin-right: 6px; padding: 6px 10px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: white; padding: 22px; border-radius: 14px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: #072e1d; font-size: 1.2em; margin-bottom: 4px; }
        .modal-sub { font-size: 0.84em; color: #666; margin-bottom: 14px; display: block; font-weight: 500; }
        .modal-content label { display: block; margin-top: 12px; font-size: 0.85em; font-weight: 600; color: #444; }
        .modal-content select, .modal-content input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; outline: none; }
        .modal-content select:focus, .modal-content input:focus { border-color: #072e1d; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

        /* Room Photo Preview Image Box */
        .room-photo-box {
            width: 100%;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ccc;
            margin-top: 8px;
        }
        .room-photo-box img {
            width: 100%;
            max-height: 340px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Portal Top Navigation Bar -->
    <div class="portal-header">
        <div class="portal-logo-area">
            <div>
                <div class="portal-title">ISU CAS PORTAL</div>
                <div class="portal-subtitle">College of Arts and Sciences</div>
            </div>
        </div>
        <div id="admin-bar">
            <button class="admin-portal-btn" onclick="login()">Admin Login</button>
        </div>
    </div>

<div class="container">
    <div class="header-title">
        <h1>Classroom Availability Tracker</h1>
        <p class="sub">Real-Time Status & Location Guide</p>
    </div>

    <!-- Quick Search Bar -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search room name or building (e.g. Math Lab, SB 1)..." oninput="draw()">
    </div>

    <!-- Live Summary Banner -->
    <div class="summary-banner" id="summaryBanner">
        <span class="summary-item avail" id="availCount">Available: 0</span>
        <span class="summary-item occ" id="occCount">Occupied: 0</span>
    </div>

    <!-- Interactive Classroom Location Viewer Container with Carousel -->
    <div class="map-card">
        <div class="map-header-row">
            <span class="map-title" id="mapTitle">Interactive Building Location</span>
            <span class="slide-counter" id="slideCounter">1 / 1</span>
        </div>
        
        <div class="map-viewport" id="map-container">
            <button class="carousel-btn prev-btn" id="prevBtn" onclick="changeSlide(-1)">&#10094;</button>
            <img id="map-image" src="IMG_20261029_175539_566.jpg" alt="Building View">
            <button class="carousel-btn next-btn" id="nextBtn" onclick="changeSlide(1)">&#10095;</button>
        </div>
        <div class="swipe-hint" id="swipeHint">Swipe or use arrows to view building photos</div>
    </div>

    <!-- CAS Building Filter Tabs -->
    <div class="filter-container" id="filter-tabs">
        <button class="filter-pill" onclick="filterBuilding('All', this)">All Buildings</button>
        <button class="filter-pill" onclick="filterBuilding('Abaya Hall', this)">Abaya Hall</button>
        <button class="filter-pill" onclick="filterBuilding('ELS Building', this)">ELS Building</button>
        <button class="filter-pill" onclick="filterBuilding('Comm Building', this)">Comm Building</button>
        <button class="filter-pill" onclick="filterBuilding('New Science Building', this)">New Science Building</button>
        <button class="filter-pill" onclick="filterBuilding('Psychology Building', this)">Psychology Building</button>
        <button class="filter-pill" onclick="filterBuilding('Science Building', this)">Science Building</button>
    </div>

    <!-- Room List Container -->
    <div id="rooms">Loading classrooms...</div>
</div>

<!-- Room Photo Preview Modal -->
<div class="modal-overlay" id="photoModal" onclick="if(event.target === this) closePhotoModal()">
    <div class="modal-content">
        <h3 id="photoModalTitle">Room Name</h3>
        <span class="modal-sub" id="photoModalLoc">Building Location</span>
        <div class="room-photo-box">
            <img id="photoModalImg" src="" alt="Classroom Location Photo">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closePhotoModal()">Close</button>
        </div>
    </div>
</div>

<!-- Edit Modal Popup -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 id="modalRoomTitle">Edit Room</h3>
        <input type="hidden" id="modalIndex">
        
        <label>Status:</label>
        <select id="modalStatus">
            <option value="Available">Available</option>
            <option value="Occupied">Occupied</option>
        </select>

        <label>From Time:</label>
        <input type="time" id="modalStart">

        <label>To Time:</label>
        <input type="time" id="modalEnd">

        <div class="modal-actions">
            <button class="btn" style="background: #888;" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="saveModal()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCpASYJtOQgpvQ9mqlWNrN07by25HRKio",
        authDomain: "isu-room-tracker.firebaseapp.com",
        databaseURL: "https://isu-room-tracker-default-rtdb.firebaseio.com",
        projectId: "isu-room-tracker",
        storageBucket: "isu-room-tracker.firebasestorage.app",
        messagingSenderId: "219062886718",
        appId: "1:219062886718:web:2fdef8f1e65bdea8d30c6f",
        measurementId: "G-HGKLGXGDBK"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const roomsRef = db.ref("rooms");

    // Building Galleries Database
    const buildingGalleries = {
        "All": [
            { src: "IMG_20261029_175539_566.jpg", title: "CAS Campus Overview" }
        ],
        "Science Building": [
            { src: "IMG_20261029_175814_693.jpg", title: "Science Building View 1" },
            { src: "IMG_20261029_175829_031.jpg", title: "Science Building View 2" }
        ],
        "New Science Building": [
            { src: "IMG_20261029_180849_556.jpg", title: "New Science Building Exterior" }
        ]
    };

    // Individual Room Photos Mapping
    const roomPhotos = {
        "Microbiology & Bio-industry Lab (1st Flr)": "MicrobiologyAndBioindustry .jpg",
        "Molecular & Biotechnology Lab (1st Flr)": "MolecularAndBiotechLab.jpg",
        "Ecology & Biodiversity Lab (1st Flr)": "EcologyAndBioLab.jpg",
        "General Anatomy Lab (1st Flr)": "GeneralAnatomyLab.jpg",
        "General Physiology Lab / Protein Chem & Biosensor Lab (1st Flr)": "GeneralPhysiologyLaboratory.jpg",
        "Natural Products Lab (2nd Flr)": "NaturalProductsLab.jpg",
        "Ana Chem A - Analytical Service A (2nd Flr)": "AnalyticalLabA.jpg",
        "Ana Chem B - Analytical Service B (2nd Flr)": "AnalyticalLabB.jpg",
        "Math Laboratory (2nd Flr)": "MathLab.jpg",
        "Physics Laboratory (2nd Flr)": "PhysicsLab.jpg"
    };

    let currentBuilding = sessionStorage.getItem("isu_filter") || "All";
    let currentSlideIndex = 0;

    function getActiveGallery() {
        return buildingGalleries[currentBuilding] || [{ src: "IMG_20261029_175539_566.jpg", title: `${currentBuilding} Location` }];
    }

    function updateCarousel() {
        const gallery = getActiveGallery();
        if (currentSlideIndex >= gallery.length) currentSlideIndex = 0;
        if (currentSlideIndex < 0) currentSlideIndex = gallery.length - 1;

        const img = document.getElementById("map-image");
        const title = document.getElementById("mapTitle");
        const counter = document.getElementById("slideCounter");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const hint = document.getElementById("swipeHint");

        img.src = gallery[currentSlideIndex].src;
        title.innerText = gallery[currentSlideIndex].title;
        counter.innerText = `${currentSlideIndex + 1} / ${gallery.length}`;

        if (gallery.length > 1) {
            prevBtn.style.display = "flex";
            nextBtn.style.display = "flex";
            hint.style.display = "block";
        } else {
            prevBtn.style.display = "none";
            nextBtn.style.display = "none";
            hint.style.display = "none";
        }
    }

    function changeSlide(direction) {
        currentSlideIndex += direction;
        updateCarousel();
    }

    // Touch swipe support for mobile phones
    let touchStartX = 0;
    let touchEndX = 0;
    const viewport = document.getElementById("map-container");

    viewport.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, false);

    viewport.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, false);

    function handleSwipe() {
        const gallery = getActiveGallery();
        if (gallery.length <= 1) return;

        if (touchEndX < touchStartX - 50) {
            changeSlide(1);
        }
        if (touchEndX > touchStartX + 50) {
            changeSlide(-1);
        }
    }

    const defaultList = [
        { name: "Section 1", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 2", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 3", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 4", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 5", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 6", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 7", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 8", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 9", loc: "Abaya Hall", status: "Available", start: "", end: "" },
        { name: "Section 10", loc: "Abaya Hall", status: "Available", start: "", end: "" },

        { name: "Room 103", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 104", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 105", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 203", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 204", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 205", loc: "ELS Building", status: "Available", start: "", end: "" },
        { name: "Room 206", loc: "ELS Building", status: "Available", start: "", end: "" },

        { name: "Broadcast Laboratory", loc: "Comm Building", status: "Available", start: "", end: "" },
        { name: "Speech Laboratory", loc: "Comm Building", status: "Available", start: "", end: "" },

        { name: "Microbiology & Bio-industry Lab (1st Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Molecular & Biotechnology Lab (1st Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Ecology & Biodiversity Lab (1st Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "General Anatomy Lab (1st Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "General Physiology Lab / Protein Chem & Biosensor Lab (1st Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },

        { name: "Natural Products Lab (2nd Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Ana Chem A - Analytical Service A (2nd Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Ana Chem B - Analytical Service B (2nd Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Math Laboratory (2nd Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },
        { name: "Physics Laboratory (2nd Flr)", loc: "New Science Building", status: "Available", start: "", end: "" },

        { name: "Room 201", loc: "Psychology Building", status: "Available", start: "", end: "" },
        { name: "Room 202", loc: "Psychology Building", status: "Available", start: "", end: "" },
        { name: "Room 203", loc: "Psychology Building", status: "Available", start: "", end: "" },

        { name: "SB 1", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "SB 2", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "SB 3", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "SB 4", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "General Zoology (SB 5)", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "SB 6", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "SB 7", loc: "Science Building", status: "Available", start: "", end: "" },
        { name: "Invertebrate Zoology (SB 8)", loc: "Science Building", status: "Available", start: "", end: "" }
    ];

    let list = [];
    let isAdmin = false;
    let currentFilter = sessionStorage.getItem("isu_filter") || "All";

    window.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('#filter-tabs .filter-pill');
        buttons.forEach(btn => {
            if (btn.innerText.includes(currentFilter) || (currentFilter === "All" && btn.innerText.includes("All"))) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        currentBuilding = currentFilter;
        currentSlideIndex = 0;
        updateCarousel();
    });

    roomsRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            roomsRef.set(defaultList);
            list = defaultList;
        } else {
            list = data;
        }
        checkAllExpiries();
        draw();
    });

    function checkAllExpiries() {
        let updated = false;
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        list.forEach((r, i) => {
            if (r.status === "Occupied" && r.end) {
                const [endH, endM] = r.end.split(":").map(Number);
                const endMinutes = endH * 60 + endM;

                if (currentMinutes >= endMinutes) {
                    list[i].status = "Available";
                    list[i].start = "";
                    list[i].end = "";
                    updated = true;
                }
            }
        });

        if (updated) {
            roomsRef.set(list);
        }
    }

    setInterval(checkAllExpiries, 15000);

    function filterBuilding(building, el) {
        currentFilter = building;
        currentBuilding = building;
        currentSlideIndex = 0;
        sessionStorage.setItem("isu_filter", building);
        
        const pills = document.querySelectorAll('.filter-pill');
        pills.forEach(p => p.classList.remove('active'));
        if (el) el.classList.add('active');

        updateCarousel();
        draw();
    }

    function openPhotoModal(index) {
        const r = list[index];
        const photoFile = roomPhotos[r.name];
        if (!photoFile) return;

        document.getElementById("photoModalTitle").innerText = r.name;
        document.getElementById("photoModalLoc").innerText = r.loc;
        document.getElementById("photoModalImg").src = photoFile;
        document.getElementById("photoModal").style.display = "flex";
    }

    function closePhotoModal() {
        document.getElementById("photoModal").style.display = "none";
    }

    function draw() {
        const div = document.getElementById("rooms");
        div.innerHTML = "";
        
        let indexedList = list.map((r, i) => ({ ...r, originalIndex: i }));

        // Search query filtering
        const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
        if (searchQuery) {
            indexedList = indexedList.filter(r => 
                r.name.toLowerCase().includes(searchQuery) || 
                r.loc.toLowerCase().includes(searchQuery)
            );
        }

        // Calculate live summary stats based on current view context
        let filteredForStats = currentFilter === "All" ? indexedList : indexedList.filter(r => r.loc === currentFilter);
        let availCount = filteredForStats.filter(r => r.status === "Available").length;
        let occCount = filteredForStats.filter(r => r.status === "Occupied").length;
        
        document.getElementById("availCount").innerText = `Available: ${availCount}`;
        document.getElementById("occCount").innerText = `Occupied: ${occCount}`;

        // Stable sort: Available rooms first
        indexedList.sort((a, b) => {
            if (a.status === "Available" && b.status === "Occupied") return -1;
            if (a.status === "Occupied" && b.status === "Available") return 1;
            return a.originalIndex - b.originalIndex;
        });

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        indexedList.forEach((r) => {
            let i = r.originalIndex;

            if (!searchQuery && currentFilter !== "All" && r.loc !== currentFilter) {
                return;
            }

            let timeSub = "";
            if (r.status === "Occupied" && r.start && r.end) {
                const [endH, endM] = r.end.split(":").map(Number);
                const endMinutes = endH * 60 + endM;
                const diffMins = endMinutes - currentMinutes;

                let countdownText = "";
                if (diffMins > 0 && diffMins < 1440) {
                    if (diffMins < 60) {
                        countdownText = `Opens in ${diffMins}m`;
                    } else {
                        let hrs = Math.floor(diffMins / 60);
                        let mins = diffMins % 60;
                        countdownText = `Opens in ${hrs}h ${mins}m`;
                    }
                }

                timeSub = `<span class="time-badge">${formatTime(r.start)} - ${formatTime(r.end)}<br><b>${countdownText}</b></span>`;
            }

            const hasPhoto = Boolean(roomPhotos[r.name]);
            let editBtn = isAdmin ? `<button class="btn btn-edit" onclick="openEditModal(${i})">Edit</button>` : "";

            let rightColumnHtml = `
                <div class="room-action-col">
                    <div class="room-badge ${r.status}">
                        <span>${r.status}</span>
                        ${timeSub}
                    </div>`;
            
            if (hasPhoto) {
                rightColumnHtml += `<button class="view-room-btn" onclick="openPhotoModal(${i})">View Room</button>`;
            }
            
            rightColumnHtml += `</div>`;

            let html = `
                <div class="room-card">
                    <div class="room-info">
                        <span class="room-name">${r.name}</span>
                        <span class="room-loc">${r.loc}</span>
                    </div>
                    ${editBtn}
                    ${rightColumnHtml}
                </div>`;
            div.innerHTML += html;
        });

        if (indexedList.length === 0) {
            div.innerHTML = `<div style="text-align: center; color: #777; padding: 20px;">No classrooms found matching your search.</div>`;
        }
    }

    function openEditModal(index) {
        const r = list[index];
        document.getElementById("modalIndex").value = index;
        document.getElementById("modalRoomTitle").innerText = `Edit: ${r.name}`;
        document.getElementById("modalStatus").value = r.status;
        document.getElementById("modalStart").value = r.start || "";
        document.getElementById("modalEnd").value = r.end || "";
        document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("editModal").style.display = "none";
    }

    function saveModal() {
        const index = document.getElementById("modalIndex").value;
        const newStatus = document.getElementById("modalStatus").value;
        const newStart = document.getElementById("modalStart").value;
        const newEnd = document.getElementById("modalEnd").value;

        let updatedRoom = {
            ...list[index],
            status: newStatus,
            start: newStart,
            end: newEnd
        };

        if ((newStart || newEnd) && newStatus === "Available") {
            updatedRoom.status = "Occupied";
        }

        roomsRef.child(index).set(updatedRoom);
        closeModal();
    }

    function login() {
        const pin = prompt("Enter Admin Password:");
        if (pin === "ISU2026") {
            isAdmin = true;
            document.getElementById("admin-bar").innerHTML = `<button class="admin-portal-btn" style="background:#555;" onclick="logout()">Logout</button>`;
            draw();
        } else if (pin) {
            alert("Incorrect Password");
        }
    }

    function logout() {
        isAdmin = false;
        document.getElementById("admin-bar").innerHTML = `<button class="admin-portal-btn" onclick="login()">Admin Login</button>`;
        draw();
    }

    function formatTime(t) {
        if (!t) return "";
        let [h, m] = t.split(":");
        h = parseInt(h);
        let ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${m} ${ampm}`;
    }
</script>

</body>
