<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Classroom Availability Tracker</title>
    <!-- Panzoom JS for interactive zooming, panning, and rotating -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #0b6623; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; margin-top: 0; margin-bottom: 20px; }
        
        /* Interactive Map Viewer Styles */
        .map-card { background: #f0f7f2; border: 1px dashed #0b6623; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .map-title { font-weight: bold; color: #0b6623; margin-bottom: 8px; display: block; font-size: 1.05em; }
        
        .map-viewport { 
            width: 100%; 
            height: 320px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            background: #222; 
            overflow: hidden; 
            position: relative; 
            cursor: grab;
            margin: 10px 0;
        }
        .map-viewport:active { cursor: grabbing; }
        
        #map-image { 
            max-width: 100%; 
            height: auto; 
            display: block; 
            margin: auto; 
            transition: transform 0.1s ease;
        }

        .map-controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .map-btn { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .map-btn:hover { background: #555; }
        
        .room { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; }
        .Available { color: green; font-weight: bold; }
        .Occupied { color: red; font-weight: bold; }
        .btn { background: #0b6623; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .btn-lock { background: #555; }
        .controls { margin-top: 10px; background: #eee; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏫 ISU Classroom Availability Tracker</h1>
    <p class="sub">BS Chemistry & Campus Room Finder</p>
    
    <div id="admin-bar" style="text-align: right; margin-bottom: 10px;">
        <button class="btn" onclick="login()">🔑 Admin Login</button>
    </div>

    <!-- Interactive Campus Diagram Card -->
    <div class="map-card">
        <span class="map-title">🗺️ Interactive Campus Layout</span>
        <p style="font-size: 0.8em; color: #555; margin: 0;">Drag to pan, scroll/buttons to zoom, or rotate to adjust view:</p>
        
        <div class="map-viewport" id="map-container">
            <!-- Linked to image.png -->
            <img id="map-image" src="image.png" alt="Campus Building Layout">
        </div>

        <div class="map-controls">
            <button class="map-btn" onclick="zoomIn()">🔍 Zoom In</button>
            <button class="map-btn" onclick="zoomOut()">🔍 Zoom Out</button>
            <button class="map-btn" onclick="rotateMap()">🔄 Rotate 90°</button>
            <button class="map-btn" onclick="resetMap()">↩️ Reset View</button>
        </div>
    </div>

    <!-- Room List Container -->
    <div id="rooms"></div>
</div>

<script>
    // Initialize Panzoom on the map image
    const elem = document.getElementById('map-image');
    const panzoom = Panzoom(elem, {
        maxScale: 5,
        minScale: 0.5,
        contain: 'outside'
    });

    // Enable mouse wheel zooming
    elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);

    let currentRotation = 0;

    function zoomIn() { panzoom.zoomIn(); }
    function zoomOut() { panzoom.zoomOut(); }
    function resetMap() { 
        currentRotation = 0;
        panzoom.reset(); 
    }
    function rotateMap() {
        currentRotation = (currentRotation + 90) % 360;
        panzoom.rotate(currentRotation);
    }

    // Tracker Logic
    const defaultList = [
        { name: "Chem Lab 101", loc: "Science Wing", status: "Available", start: "", end: "" },
        { name: "Lecture Hall A", loc: "Main Building", status: "Available", start: "", end: "" },
        { name: "Room 203", loc: "Main Building", status: "Occupied", start: "13:00", end: "14:30" }
    ];

    let list = JSON.parse(localStorage.getItem("isu_rooms_data")) || defaultList;
    let isAdmin = false;

    function checkTimeExpiry(r) {
        if (r.status === "Occupied" && r.end) {
            const now = new Date();
            const [endH, endM] = r.end.split(":").map(Number);
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const endMinutes = endH * 60 + endM;

            if (currentMinutes >= endMinutes) {
                r.status = "Available";
                r.start = "";
                r.end = "";
            }
        }
    }

    function draw() {
        const div = document.getElementById("rooms");
        div.innerHTML = "";
        
        list.forEach((r, i) => {
            checkTimeExpiry(r);

            let timeText = r.status === "Occupied" && r.start && r.end ? ` (${formatTime(r.start)} - ${formatTime(r.end)})` : "";
            let html = `<div class="room">
                <b>${r.name}</b> (${r.loc}) - <span class="${r.status}">${r.status}${timeText}</span>`;
            
            if (isAdmin) {
                html += `
                <div class="controls">
                    Status: <select onchange="updateData(${i}, 'status', this.value)">
                        <option value="Available" ${r.status==='Available'?'selected':''}>Available</option>
                        <option value="Occupied" ${r.status==='Occupied'?'selected':''}>Occupied</option>
                    </select>
                    From: <input type="time" value="${r.start}" onchange="updateData(${i}, 'start', this.value)">
                    To: <input type="time" value="${r.end}" onchange="updateData(${i}, 'end', this.value)">
                </div>`;
            }
            html += `</div>`;
            div.innerHTML += html;
        });
        localStorage.setItem("isu_rooms_data", JSON.stringify(list));
    }

    function updateData(index, key, value) {
        list[index][key] = value;
        if (key === 'start' || key === 'end') {
            list[index].status = "Occupied";
        }
        localStorage.setItem("isu_rooms_data", JSON.stringify(list));
        draw();
    }

    function login() {
        const pin = prompt("Enter Admin PIN:");
        if (pin === "1234") {
            isAdmin = true;
            document.getElementById("admin-bar").innerHTML = `<button class="btn btn-lock" onclick="logout()">🔒 Save & Lock</button>`;
            draw();
        } else if (pin) {
            alert("Wrong PIN");
        }
    }

    function logout() {
        isAdmin = false;
        document.getElementById("admin-bar").innerHTML = `<button class="btn" onclick="login()">🔑 Admin Login</button>`;
        draw();
    }

    function formatTime(t) {
        if (!t) return "";
        let [h, m] = t.split(":");
        h = parseInt(h);
        let ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${m} ${ampm}`;
    }

    setInterval(draw, 10000);
    draw();
</script>

</body>
</html>
